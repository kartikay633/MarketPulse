# ROADMAP: Section 22 — Phase 0 (Docker PostgreSQL)
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: marketpulse-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse_dev
      POSTGRES_DB: marketpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketpulse']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
